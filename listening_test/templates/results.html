{% extends "base.html" %}
{% block title %}Resultaten{% endblock %}
{% block body_class %}projector{% endblock %}
{% block content %}
<h1>Hoe goed hoort de klas het verschil?</h1>
<p class="muted" id="totals">…</p>
<div id="bars"></div>
<p class="muted">Percentage goed beoordeeld per soort clip. Ververst elke 2 seconden.</p>
<button id="reveal-btn">Onthul</button>
<p id="reveal" class="reveal" hidden></p>
<script>
async function refresh() {
  try {
    const data = await (await fetch('/api/results', {cache: 'no-store'})).json();
    document.getElementById('totals').textContent =
      data.ratings + ' beoordelingen · ' + data.raters + ' beoordelaars · ' + data.uploads + ' sprekers geüpload';
    const bars = document.getElementById('bars');
    bars.innerHTML = '';
    for (const c of data.categories) {
      const row = document.createElement('div');
      row.className = 'bar-row';
      const pct = c.pct === null ? 0 : c.pct;
      row.innerHTML = '<span class="bar-label"></span><span class="bar"><span class="fill"></span></span>' +
                      '<span class="bar-value"></span>';
      row.querySelector('.bar-label').textContent = c.label;
      row.querySelector('.fill').style.width = pct + '%';
      row.querySelector('.fill').classList.add(c.key === 'echt' ? 'real' : 'fake');
      row.querySelector('.bar-value').textContent = c.pct === null ? '–' : c.pct + '% (n=' + c.n + ')';
      bars.appendChild(row);
    }
    document.getElementById('reveal').textContent = data.clones_marked_real_pct === null ? 'Nog geen beoordelingen.' :
      data.clones_marked_real_pct + '% van de klonen werd voor echt aangezien.';
  } catch (e) { /* keep the last view if one poll fails */ }
}
document.getElementById('reveal-btn').onclick = () => {
  const r = document.getElementById('reveal');
  r.hidden = !r.hidden;
};
refresh();
setInterval(refresh, 2000);
</script>
{% endblock %}
